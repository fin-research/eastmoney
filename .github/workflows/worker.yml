name: Worker checks
on:
  workflow_call:
    inputs:
      project:
        type: string
        required: true
      command:
        type: string
        required: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ inputs.project }}/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: ${{ inputs.project }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: ${{ inputs.command }}
