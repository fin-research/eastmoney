[project]
name = "timing-model"
version = "0.1.0"
description = "Bond issuance coupon research, training and private inference"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.71",
    "certifi>=2025.0.0",
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "lightgbm>=4.6.0",
    "llvmlite>=0.42",
    "matplotlib>=3.11.0",
    "numba>=0.59",
    "numpy<2.5",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "psycopg[binary]>=3.2.0",
    "python-calamine>=0.7.0",
    "rich>=14.0.0",
    "scikit-learn>=1.9.0",
    "shap>=0.46",
    "statsmodels>=0.14.5",
    "threadpoolctl>=3.6.0",
    "xlsxwriter>=3.2.9",
]

[project.optional-dependencies]
archived-margin = [
    "timesfm[torch]==2.0.1",
    "torch==2.12.1",
    "jax[cpu]==0.10.2",
]

[tool.uv]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'"
]

[dependency-groups]
dev = [
    "coverage>=7.16.1",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", ".venv/*", "scripts/*", "skills/*"]
data_file = "coverage/.coverage"

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = "coverage/html"

[tool.coverage.json]
output = "coverage/coverage.json"
